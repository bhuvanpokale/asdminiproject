services:
  placementpro:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: placementpro-app
    ports:
      - "5000:5000"
    environment:
      - SECRET_KEY=placementpro-local-dev-key
      - PORT=5000
    volumes:
      - placementpro_data:/app/data
    restart: unless-stopped

volumes:
  placementpro_data:
