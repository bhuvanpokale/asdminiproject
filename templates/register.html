{% extends "base.html" %}

{% block title %}Register - PlacementPro{% endblock %}

{% block auth_content %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
        <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
            <div class="card-header bg-slate text-white text-center py-4 px-4 border-0">
                <div class="brand-icon mx-auto mb-3 rounded-circle bg-primary text-white d-flex align-items-center justify-content-center" style="width: 56px; height: 56px;">
                    <i class="bi bi-person-plus-fill fs-3"></i>
                </div>
                <h4 class="fw-bold mb-1">Create Student Account</h4>
                <p class="text-secondary-subtle small mb-0">Join PlacementPro to manage applications & interview prep</p>
            </div>
            <div class="card-body p-4 p-md-5 bg-white">
                <form method="POST" action="{{ url_for('register') }}">
                    <div class="row g-3">
                        <div class="col-sm-6">
                            <label for="username" class="form-label fw-semibold text-secondary small">Username *</label>
                            <input type="text" class="form-control" id="username" name="username" placeholder="e.g. rahul_sharma" required autofocus>
                        </div>
                        <div class="col-sm-6">
                            <label for="email" class="form-label fw-semibold text-secondary small">Email Address *</label>
                            <input type="email" class="form-control" id="email" name="email" placeholder="student@college.edu" required>
                        </div>

                        <div class="col-12">
                            <label for="full_name" class="form-label fw-semibold text-secondary small">Full Name</label>
                            <input type="text" class="form-control" id="full_name" name="full_name" placeholder="Rahul Sharma">
                        </div>

                        <div class="col-sm-6">
                            <label for="department" class="form-label fw-semibold text-secondary small">Department / Branch</label>
                            <select class="form-select" id="department" name="department">
                                <option value="Computer Engineering" selected>Computer Engineering</option>
                                <option value="Information Technology">Information Technology</option>
                                <option value="Artificial Intelligence & Data Science">AI & Data Science</option>
                                <option value="Electronics & Telecommunication">Electronics & Telecom</option>
                                <option value="Electrical Engineering">Electrical Engineering</option>
                                <option value="Mechanical Engineering">Mechanical Engineering</option>
                            </select>
                        </div>
                        <div class="col-sm-6">
                            <label for="grad_year" class="form-label fw-semibold text-secondary small">Graduation Year</label>
                            <input type="text" class="form-control" id="grad_year" name="grad_year" placeholder="2026" value="2026">
                        </div>

                        <div class="col-sm-6">
                            <label for="password" class="form-label fw-semibold text-secondary small">Password (min 6 chars) *</label>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Create password" required minlength="6">
                        </div>
                        <div class="col-sm-6">
                            <label for="confirm_password" class="form-label fw-semibold text-secondary small">Confirm Password *</label>
                            <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Confirm password" required minlength="6">
                        </div>
                    </div>

                    <div class="mt-4">
                        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm">
                            <i class="bi bi-check2-circle me-1"></i> Complete Registration
                        </button>
                    </div>
                </form>

                <div class="text-center mt-4">
                    <p class="text-muted small mb-0">Already registered? 
                        <a href="{{ url_for('login') }}" class="text-primary fw-semibold text-decoration-none">Sign In here</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
